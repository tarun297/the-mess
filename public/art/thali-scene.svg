<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Comic ink illustration of a full mess thali: steel plate with dal, paneer sabzi, rice, rotis, papad, pickle, onion and chilli, with a cutting chai glass, a steaming handi and a steel spoon on a burst background">
